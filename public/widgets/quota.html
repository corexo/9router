<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>PiRouter Quota &amp; Accounts</title>
<style>
:root{color-scheme:dark}
body{font:13px/1.45 ui-sans-serif,system-ui,sans-serif;background:#16181d;color:#d7dae0;margin:0;padding:14px}
h1{font-size:14px;margin:0 0 10px;color:#8ab4f8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:#1e2128;border:1px solid #2a2e37;border-radius:8px;padding:8px 10px}
.kpi b{display:block;font-size:17px;color:#e8eaed}
.kpi span{font-size:11px;color:#9aa0a6}
table{width:100%;border-collapse:collapse;margin-top:4px}
th,td{text-align:left;padding:3px 6px;border-bottom:1px solid #23262d}
th{color:#9aa0a6;font-weight:600;font-size:11px;text-transform:uppercase}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.on{color:#81c995}.off{color:#9aa0a6}
.sub{color:#9aa0a6;font-size:11px;margin:10px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.err{color:#f28b82}
</style></head><body>
<h1>PiRouter Accounts &amp; Quota</h1>
<div id="content">lädt …</div>
<script>
const f=(n)=>n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":String(n??0);
const c=(v)=>"$"+(Number(v)||0).toFixed(2);
async function load(){
 try{
  const r=await fetch("/api/widgets");if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();
  const k=d.kpis||{};
  const acc=(d.accounts||[]).slice(0,14);
  document.getElementById("content").innerHTML=
   `<div class="grid">
    <div class="kpi"><b>${k.activeAccountsCount??0}/${k.totalAccountsCount??0}</b><span>Accounts aktiv</span></div>
    <div class="kpi"><b>${k.activeSessionsCount??0}</b><span>Sessions aktiv</span></div>
    <div class="kpi"><b>${(k.cacheHitRate??0).toFixed?k.cacheHitRate.toFixed(1)+"%":k.cacheHitRate}%</b><span>Cache-Hit</span></div>
    <div class="kpi"><b>${c(k.estimatedSavingsUsd)}</b><span>Cash-Ersparnis</span></div>
    <div class="kpi"><b>${k.jevSuccessRate??0}%</b><span>Jev-Erfolg</span></div>
   </div>
   <div class="sub">Accounts (24h)</div>
   <table><tr><th>Account</th><th>Provider</th><th class="num">Req</th><th class="num">In</th><th class="num">Out</th><th class="num">$</th></tr>
   ${acc.map(a=>`<tr><td class="${a.isActive?"on":"off"}">${a.isActive?"●":"○"} ${a.name}</td><td>${a.provider||""}</td><td class="num">${f(a.requests)}</td><td class="num">${f(a.promptTokens)}</td><td class="num">${f(a.completionTokens)}</td><td class="num">${c(a.cost)}</td></tr>`).join("")}</table>
   <div class="sub">Aktive Sessions</div>
   <table><tr><th>Session</th><th>Modell</th><th class="num">Req</th><th class="num">Cached</th></tr>
   ${(d.activeSessions||[]).slice(0,8).map(s=>`<tr><td>${String(s.cacheId).slice(0,10)}…</td><td>${(s.models||[]).join(", ")||"–"}</td><td class="num">${f(s.requests)}</td><td class="num">${f(s.cachedTokens)}</td></tr>`).join("")||"<tr><td colspan=4>keine</td></tr>"}</table>`;
 }catch(e){document.getElementById("content").innerHTML=`<span class="err">Fehler: ${e.message}</span>`}
 finally{setTimeout(load,30000)}
}
load();
</script></body></html>
