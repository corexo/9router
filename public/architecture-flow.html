<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9Router Request Flow</title><style>
*{box-sizing:border-box}body{margin:0;background:#080c14;color:#cbd5e1;font:12px ui-monospace,monospace;overflow:hidden}
header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #1e293b;background:#0e1626}
h1{font:600 13px system-ui;color:#fff;margin:0}select{background:#131e33;border:1px solid #334155;color:#fff;border-radius:6px;padding:6px 10px;font:12px ui-monospace;max-width:420px}
.grid{background-image:radial-gradient(#6366f122 1px,transparent 1px);background-size:22px 22px}
.stage{width:1140px;height:640px;position:relative;margin:26px auto 0}
.phase{position:absolute;top:-18px;font-size:10px;font-weight:700;letter-spacing:.5px}
svg{position:absolute;inset:0;width:1140px;height:640px;z-index:1;pointer-events:none}
.edge{fill:none;stroke:#2b3a52;stroke-width:1.5;opacity:.5;transition:.25s}
.edge.hot{stroke:#60a5fa;stroke-width:2.6;opacity:1;filter:drop-shadow(0 0 5px #60a5fa)}
.edge.good{stroke:#10b981;filter:drop-shadow(0 0 5px #10b981)}
.edge.bad{stroke:#f43f5e;filter:drop-shadow(0 0 5px #f43f5e)}
.edge.amber{stroke:#f59e0b;filter:drop-shadow(0 0 5px #f59e0b)}
.edge.faded{opacity:.06}
.badge{font-size:9px;fill:#94a3b8;text-anchor:middle}
.node{position:absolute;width:190px;height:34px;padding:0 10px;display:flex;align-items:center;gap:8px;border-radius:17px;background:#131e33;border:1px solid #26334b;cursor:pointer;z-index:2;transition:.2s}
.node:hover{border-color:#818cf8}
.node.dim{opacity:.15;filter:grayscale(1)}
.node.on{border-color:#38bdf8;box-shadow:0 0 0 2px #38bdf866,0 0 14px #38bdf855}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.label{font:600 11px system-ui;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms{margin-left:auto;font-size:9px;color:#64748b}
.i .dot{background:#22d3ee}.i{border-color:#155e7566}
.p .dot{background:#818cf8}.p{border-color:#3730a366}
.s .dot{background:#fbbf24}.s{border-color:#92400e66}
.o .dot{background:#34d399}.o{border-color:#065f4666}
.e .dot{background:#fb7185}.e{border-color:#9f123966}
#card{position:absolute;z-index:5;width:250px;background:#0e1626;border:1px solid #334155;border-radius:10px;padding:12px;display:none;box-shadow:0 10px 30px #000a}
#card h3{margin:0 0 4px;font:700 13px system-ui;color:#fff}
#card .t{font-size:9px;letter-spacing:1px;color:#818cf8;margin-bottom:8px}
#card p{margin:0 0 10px;color:#94a3b8;font-size:11px;line-height:1.5}
#card .row{font-size:10px;color:#64748b;margin:6px 0 2px}
#card .rt{background:#080c14;border:1px solid #1e293b;border-radius:5px;padding:4px 6px;margin:3px 0;font-size:10px;color:#a5b4fc}
#card .x{position:absolute;top:8px;right:10px;cursor:pointer;color:#64748b}
#status{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#0e1626e6;border:1px solid #1e293b;border-radius:8px;padding:6px 14px;font-size:11px}
#status b{color:#67e8f9}
</style><body>
<header><h1>9Router Request Flow</h1><select id="req">
<option value="" selected disabled>Request wählen…</option>
<option value="cache">req-01 · Standard Read (Cache HIT)</option>
<option value="db">req-02 · Transaction (DB + Kafka)</option>
<option value="ai">req-03 · AI Processing (SSE Stream)</option>
<option value="auth">req-04 · Blocked (401)</option>
</select></header>
<div class="stage grid"><div class="phase" style="left:0;color:#22d3ee">INGESTION</div><div class="phase" style="left:290px;color:#818cf8">GATEWAY &amp; CORE</div><div class="phase" style="left:940px;color:#34d399">OUTPUT</div>
<svg><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#475569"/></marker></defs><g id="edges"></g><g id="badges"></g><g id="parts"></g></svg>
<div id="nodes"></div><div id="card"><span class="x" onclick="card.style.display='none'">✕</span><div class="t" id="c-t"></div><h3 id="c-n"></h3><p id="c-d"></p><div class="row">LATENZ</div><div class="rt" id="c-l"></div><div class="row">EINGANG</div><div id="c-i"></div><div class="row">AUSGANG</div><div id="c-o"></div></div>
</div>
<div id="status">Bereit — Request wählen oder Knoten anklicken</div>
<script>
const N=[
['http','HTTP REST','input',0,40,15,'Synchrone OpenAI-kompatible REST-Anfrage (Claude Code, CLI, Web).'],
['webhook','Webhook','input',0,150,10,'Verifizierte POST-Events von Drittanbietern.'],
['cron','Cron / Scheduler','input',0,260,10,'Zeitgesteuerte Systemjobs.'],
['gateway','API Gateway','process',290,115,20,'Routing, IP-Filter, Token-Bucket Rate-Limit.'],
['auth','Auth / JWT','process',290,235,30,'API-Key, JWT-Signatur, Scope, Tenant-Check.'],
['cache','Redis Cache','storage',590,30,8,'In-Memory Cache für häufige Reads.'],
['engine','Business Engine','process',590,160,45,'Provider-Routing, Fallback, Quotas, Orchestrierung.'],
['db','PostgreSQL','storage',590,290,55,'Persistente ACID-Transaktionen.'],
['queue','Kafka Queue','storage',590,410,25,'Asynchrone Job-Entkopplung.'],
['ai','LLM Inference','process',590,520,160,'Provider-/LLM-Inferenz, Token-Erzeugung.'],
['ok','HTTP 200 / 201','ok',940,50,10,'Erfolgreiche JSON-Antwort.'],
['stream','SSE Stream','ok',940,180,12,'Live-Token-Streaming.'],
['ack','ACK 202','ok',940,310,10,'Async-Job angenommen.'],
['error','Error 4xx / 5xx','e',940,450,8,'Auth-, Validierungs- oder Serverfehler.']
].map(([id,name,group,x,y,lat,desc])=>({id,name,group,x,y,lat,desc}));
const E=[['http','gateway','REST Call'],['webhook','gateway','Inbound POST'],['cron','queue','Scheduled Job'],['gateway','auth','Rate-Limit OK'],['auth','cache','Read Cache'],['auth','engine','Token gültig'],['auth','error','Unauthorized 401','bad'],['cache','ok','Cache HIT','good'],['cache','engine','Cache MISS'],['engine','db','ACID Write'],['engine','queue','Enqueue Job'],['engine','ai','Prompt'],['engine','ok','Direct Response','good'],['db','ok','Commit OK','good'],['queue','ack','Job ACK','good'],['ai','stream','Token Stream','amber']].map(([from,to,label,status])=>({from,to,label,status}));
const P={cache:{n:'req-01 · Standard Read',path:['http','gateway','auth','cache','ok'],c:'#34d399'},db:{n:'req-02 · Transaction',path:['http','gateway','auth','engine','db','queue','ack'],c:'#60a5fa'},ai:{n:'req-03 · AI Processing',path:['http','gateway','auth','engine','ai','stream'],c:'#fbbf24'},auth:{n:'req-04 · Blocked',path:['http','gateway','auth','error'],c:'#fb7185'}};
const $=i=>document.getElementById(i),node=id=>N.find(n=>n.id===id),key=e=>e.from+'>'+e.to;let hot=new Set;
function geo(e){const a=node(e.from),b=node(e.to),sy=a.y+17,ey=b.y+17;if(a.x===b.x){const x=a.x+95;return{d:`M${x},${a.y+34} L${x},${b.y}`,mx:x,my:(a.y+34+b.y)/2}}const sx=a.x+190,ex=b.x,t=Math.max(Math.abs(ex-sx)*.45,40);return{d:`M${sx},${sy} C${sx+t},${sy} ${ex-t},${ey} ${ex},${ey}`,mx:(sx+ex)/2,my:(sy+ey)/2}}
function edges(){const g=$('edges'),b=$('badges');g.innerHTML='';b.innerHTML='';E.forEach(e=>{const{d,mx,my}=geo(e),p=document.createElementNS('http://www.w3.org/2000/svg','path');p.id='e-'+key(e);p.setAttribute('d',d);p.setAttribute('marker-end','url(#a)');p.setAttribute('class','edge '+(hot.has(key(e))?(e.status||'hot'):(hot.size?'faded':'')));g.append(p);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',mx);t.setAttribute('y',my+3);t.setAttribute('class','badge');t.setAttribute('opacity',hot.size?.4:1);t.textContent=e.label;b.append(t)})}
function nodes(){$('nodes').innerHTML='';N.forEach(n=>{const d=document.createElement('div');d.id='n-'+n.id;d.className='node '+n.group[0];d.style.left=n.x+'px';d.style.top=n.y+'px';d.innerHTML=`<span class="dot"></span><span class="label">${n.name}</span><span class="ms">${n.lat}ms</span>`;d.onclick=ev=>{ev.stopPropagation();open(n.id)};$('nodes').append(d)})}
function open(id){const n=node(id);$('c-t').textContent=n.group.toUpperCase()+' · ONLINE';$('c-n').textContent=n.name;$('c-d').textContent=n.desc;$('c-l').textContent=n.lat+' ms (typisch)';const i=E.filter(e=>e.to===id),o=E.filter(e=>e.from===id);$('c-i').innerHTML=i.map(e=>`<div class="rt">← ${node(e.from).name} <span style="color:#64748b">${e.label}</span></div>`).join('')||'<div class="rt">—</div>';$('c-o').innerHTML=o.map(e=>`<div class="rt">→ ${node(e.to).name} <span style="color:#64748b">${e.label}</span></div>`).join('')||'<div class="rt">—</div>';const c=$('card');c.style.display='block';const cx=Math.min(n.x+200,880);c.style.left=cx+'px';c.style.top=Math.max(n.y-10,0)+'px'}
function clear(){hot=new Set;N.forEach(x=>$('n-'+x.id).className='node '+x.group[0]);edges()}
async function run(k){clear();const p=P[k];hot=new Set(p.path.slice(0,-1).map((x,i)=>x+'>'+p.path[i+1]));N.forEach(x=>{if(!p.path.includes(x.id))$('n-'+x.id).classList.add('dim')});edges();let t=0;for(let i=0;i<p.path.length;i++){const id=p.path[i],n=node(id),el=$('n-'+id);el.classList.add('on');t+=n.lat;$('status').innerHTML=`${p.n} · ${i+1}/${p.path.length} · <b>${t} ms</b>`;await new Promise(r=>setTimeout(r,130));el.classList.remove('on');if(i<p.path.length-1)await fly(p.path[i],p.path[i+1],p.c);else el.classList.add('on')}$('status').innerHTML=`${p.n} · fertig · <b>${t} ms</b> · ${p.path.length} Knoten`}
function fly(a,b,c){return new Promise(d=>{const p=$('e-'+a+'>'+b),o=document.createElementNS('http://www.w3.org/2000/svg','circle'),L=p.getTotalLength(),s=performance.now();o.setAttribute('r',5);o.setAttribute('fill',c);o.style.filter=`drop-shadow(0 0 6px ${c})`;$('parts').append(o);(function f(t){const q=Math.min((t-s)/420,1),pt=p.getPointAtLength(q*L);o.setAttribute('cx',pt.x);o.setAttribute('cy',pt.y);q<1?requestAnimationFrame(f):(o.remove(),d())})(s)})}
$('req').onchange=e=>run(e.target.value);document.body.onclick=e=>{if(!e.target.closest('#card'))$('card').style.display='none'};nodes();edges()
</script>

</body></html>
