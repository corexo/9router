[Rainmeter]
Update=600000
DynamicWindowSize=1
AccurateText=1

[Variables]
; Use localhost when PiRouter runs on this Windows machine. LAN requires reachable server and dashboard access.
BaseUrl=http://127.0.0.1:20128

[MeasureQuota]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#CURRENTPATH#Quota.ps1" -BaseUrl "#BaseUrl#"
OutputType=ANSI
State=Hide
Timeout=30000
UpdateDivider=1

[MeterQuota]
Meter=String
MeasureName=MeasureQuota
X=12
Y=12
W=460
H=540
FontFace=Consolas
FontSize=11
FontColor=235,239,245,255
AntiAlias=1
ClipString=2
Text=%1
DynamicVariables=1
SolidColor=27,32,42,225
LeftMouseUpAction=[!CommandMeasure MeasureQuota "Run"]

[Metadata]
Name=PiRouter Quotas
Author=PiRouter
Information=Codex, Claude, GLM quotas; click to refresh
Version=1.0
