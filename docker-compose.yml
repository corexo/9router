services:
  9router:
    image: 9router:latest
    build: .
    container_name: 9router
    restart: unless-stopped
    ports:
      - "9310:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: 9router-headroom
    restart: unless-stopped
    ports:
      - "8787:8787"

volumes:
  9router-data:
    name: 9router-data
    external: true
